name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    name: API (build + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estoque-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      # Testes de integracao usam Testcontainers (Docker ja disponivel no runner)
      - run: chmod +x mvnw && ./mvnw -B verify

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estoque-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: estoque-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t estoque-api:ci estoque-api
      - run: docker build -t estoque-web:ci estoque-web
