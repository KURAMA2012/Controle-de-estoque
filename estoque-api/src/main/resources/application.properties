spring.application.name=estoque-api
# ESTOQUE_PORT tem prioridade; PORT e informado por hosts como Render/Railway
server.port=${ESTOQUE_PORT:${PORT:7009}}
server.servlet.context-path=/api/estoque

# Log em arquivo opcional (vazio = apenas console)
logging.file.name=${LOG_FILE:estoque-api.log}

# Seguranca / JWT (HS512: JWT_SECRET obrigatorio, minimo 64 bytes)
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4300}
# Admin inicial (usado somente se tab_usuario estiver vazia)
app.admin.login=${APP_ADMIN_LOGIN:}
app.admin.senha=${APP_ADMIN_SENHA:}
# Sem usuario em memoria gerado pelo Spring Boot
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Banco de dados (Flyway usa o mesmo datasource)
# DB_URL (JDBC completo) ou DB_HOST/DB_PORT/DB_NAME (usado no deploy do Render)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:estoque}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=${DATABASE_MAX_CONNECTION:5}
spring.datasource.hikari.minimum-idle=${DATABASE_MIN_IDLE:2}
spring.datasource.hikari.pool-name=estoque-api-pool

spring.flyway.schemas=apl_estoque
spring.flyway.baselineOnMigrate=true
spring.flyway.baselineVersion=1.0.0.0

# Upload
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Hosts permitidos para download de imagens por URL; separados por virgula, vazio por padrao
estoque.imagem.hosts-permitidos=${ESTOQUE_IMAGEM_HOSTS_PERMITIDOS:}

# Health check (GET /api/estoque/actuator/health) usado pelo deploy
management.endpoints.web.exposure.include=health
