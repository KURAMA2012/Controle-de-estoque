services:
  db:
    image: postgres:16
    container_name: estoque-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - estoque-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d estoque"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./estoque-api
    image: estoque-api:local
    container_name: estoque-api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/estoque
      ESTOQUE_PORT: "7009"
    ports:
      - "7009:7009"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./estoque-web
    image: estoque-web:local
    container_name: estoque-web
    restart: unless-stopped
    ports:
      - "4300:80"
    depends_on:
      - api

volumes:
  estoque-pgdata:
